<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EGS Live Score — Connexion Facebook</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, Roboto, Segoe UI, sans-serif;
      background: #0d0d0d;
      color: #fff;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #333;
      border-top-color: #27ae60;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { opacity: 0.8; font-size: 14px; }
    a { color: #27ae60; }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <p id="msg">Retour vers EGS Live Score…</p>
    <p id="fallback" style="display:none;">
      Si rien ne se passe automatiquement,
      <a id="manualLink" href="#">appuie ici</a>.
    </p>
  </div>

  <script>
    // ID de l'app Facebook EGS Live Score — doit correspondre à
    // facebook_app_id / fb_login_protocol_scheme dans strings.xml.
    var APP_ID = "1408454254573259";

    // Facebook renvoie le token dans le fragment (#access_token=...&...)
    // de CETTE page. On le relaie tel quel vers le schéma personnalisé
    // de l'app, que l'intent-filter de MainActivity intercepte.
    var hash = window.location.hash || "";
    var targetUrl = "fb" + APP_ID + "://authorize/" + hash;

    document.getElementById("manualLink").href = targetUrl;

    // Redirection automatique.
    window.location.href = targetUrl;

    // Si l'app ne s'est pas ouverte après un court délai (app non
    // installée, ou navigateur qui bloque la redirection auto),
    // on affiche un lien de secours cliquable.
    setTimeout(function () {
      document.getElementById("msg").textContent =
        "La redirection automatique n'a pas fonctionné.";
      document.getElementById("fallback").style.display = "block";
    }, 1500);
  </script>
</body>
</html>
